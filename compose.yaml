services:
  md-tcp0:
    image: "memcached:1.6.45-alpine"
    ports:
      - "11211:11211"

  md-unix0:
    image: "memcached:1.6.45-alpine"
    command: ["-s", "/tmp/memcached0.sock", "-a", "0666"]
    volumes:
      - "/tmp:/tmp"

  md-tcp1:
    image: "memcached:1.6.45-alpine"
    command: ["-p", "11212", "-S", "-Y", "/app/sasl.txt"]
    volumes:
      - "./sets/sasl.txt:/app/sasl.txt:ro"
    ports:
      - "11212:11212"

  md-tcp2:
    image: "memcached:1.6.45-alpine"
    restart: unless-stopped
    ports:
      - "11213:11213"
    command: ["-p", "11213", "-A"]

  md-udp0:
    image: "memcached:1.6.45-alpine"
    command: ["-U", "11214"]
    ports:
      - "11214:11214/udp"

  md-unix1:
    image: "memcached:1.6.45-alpine"
    restart: unless-stopped
    command: ["-A", "-s", "/tmp/memcached1.sock", "-a", "0666"]
    volumes:
      - "/tmp:/tmp"

  md-udp1:
    image: "memcached:1.6.45-alpine"
    restart: unless-stopped
    command: ["-U", "11215", "-A"]
    ports:
      - "11215:11215/udp"

  md-unix2:
    image: "memcached:1.6.45-alpine"
    command:
      ["-s", "/tmp/memcached2.sock", "-S", "-Y", "/app/sasl.txt", "-a", "0666"]
    volumes:
      - "./sets/sasl.txt:/app/sasl.txt:ro"
      - "/tmp:/tmp"

  md-tls0:
    image: "memcached:1.6.45-alpine"
    command:
      [
        "-p",
        "11216",
        "-Z",
        "-o",
        "ssl_chain_cert=/app/server.crt,ssl_key=/app/server.key,ssl_ca_cert=/app/ca.crt,ssl_verify_mode=2",
      ]
    volumes:
      - "./sets/server.crt:/app/server.crt:ro"
      - "./sets/server.key:/app/server.key:ro"
      - "./sets/ca.crt:/app/ca.crt:ro"
    ports:
      - "11216:11216"

  md-tls1:
    image: "memcached:1.6.45-alpine"
    restart: unless-stopped
    command:
      [
        "-p",
        "11217",
        "-A",
        "-Z",
        "-o",
        "ssl_chain_cert=/app/server.crt,ssl_key=/app/server.key",
      ]
    volumes:
      - "./sets/server.crt:/app/server.crt:ro"
      - "./sets/server.key:/app/server.key:ro"
    ports:
      - "11217:11217"

  md-tls2:
    image: "memcached:1.6.45-alpine"
    command:
      [
        "-p",
        "11218",
        "-S",
        "-Y",
        "/app/sasl.txt",
        "-Z",
        "-o",
        "ssl_chain_cert=/app/server.crt,ssl_key=/app/server.key",
      ]
    volumes:
      - "./sets/server.crt:/app/server.crt:ro"
      - "./sets/server.key:/app/server.key:ro"
      - "./sets/sasl.txt:/app/sasl.txt:ro"
    ports:
      - "11218:11218"

  md-tls3:
    image: "memcached:1.6.45-alpine"
    command:
      [
        "-l",
        "notls:0.0.0.0:11219",
        "-Z",
        "-o",
        "ssl_chain_cert=/app/server.crt,ssl_key=/app/server.key,ssl_ca_cert=/app/ca.crt,ssl_verify_mode=2",
      ]
    volumes:
      - "./sets/server.crt:/app/server.crt:ro"
      - "./sets/server.key:/app/server.key:ro"
      - "./sets/ca.crt:/app/ca.crt:ro"
    ports:
      - "11219:11219"

  md-tls4:
    image: "memcached:1.6.45-alpine"
    command:
      [
        "-s",
        "/tmp/memcached3.sock",
        "-a",
        "0666",
        "-Z",
        "-o",
        "ssl_chain_cert=/app/server.crt,ssl_key=/app/server.key,ssl_ca_cert=/app/ca.crt,ssl_verify_mode=2",
      ]
    volumes:
      - "./sets/server.crt:/app/server.crt:ro"
      - "./sets/server.key:/app/server.key:ro"
      - "./sets/ca.crt:/app/ca.crt:ro"
      - "/tmp:/tmp"

  md-tls5:
    image: "memcached:1.6.45-alpine"
    command:
      [
        "-l",
        "notls:0.0.0.0:11220",
        "-U",
        "11220",
        "-Z",
        "-o",
        "ssl_chain_cert=/app/server.crt,ssl_key=/app/server.key,ssl_ca_cert=/app/ca.crt,ssl_verify_mode=2",
      ]
    volumes:
      - "./sets/server.crt:/app/server.crt:ro"
      - "./sets/server.key:/app/server.key:ro"
      - "./sets/ca.crt:/app/ca.crt:ro"
    ports:
      - "11220:11220/udp"
