name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: "ubuntu-latest"
    name: Run tests.
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      - name: Run servers
        run: docker compose up -d
      - name: Cache job
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-features

  coverage:
    runs-on: "ubuntu-latest"
    name: Run tests coverage.
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run servers
        run: docker compose up -d
      - name: Cache job
        uses: Swatinem/rust-cache@v2
      - name: Run tests coverage
        run: cargo llvm-cov --doctests --all-features

  bench-time:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: "ubuntu-latest"
    name: Run bench time.
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      - name: Install critcmp
        uses: taiki-e/install-action@v2
        with:
          tool: critcmp
      - name: Run servers
        run: docker compose up -d
      - name: Cache job
        uses: Swatinem/rust-cache@v2
      - name: Benchmark Changes
        run: cargo bench --bench bench_time --all-features -- --save-baseline changes
      - name: Benchmark Base
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git checkout FETCH_HEAD
          cargo bench --bench bench_time --all-features -- --save-baseline base
          git checkout -
      - name: Compare
        run: critcmp base changes

  quality:
    name: Quality code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Analyze code
        uses: iepathos/debtmap-action@v1
      - name: View Report
        run: cat debtmap-report.md

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --all --check

  fuzz:
    name: Fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Cache job
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-afl
        run: cargo install cargo-afl
      - run: |
          cd fuzz
          cargo afl build
          AFL_EXIT_ON_TIME=15 \
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1 \
          AFL_SKIP_CPUFREQ=1 AFL_NO_UI=1 \
          cargo afl fuzz \
          -i in \
          -o out \
          -x memcached.dict \
          -V 30 \
          target/debug/fuzz_target_1
          [ -z "$(ls -A out/default/crashes 2>/dev/null)" ] || (ls -la out/default/crashes && head -c 256 out/default/crashes/* | xxd && exit 1)

  bench-perf:
    name: Run bench perf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup gungraun-runner and Valgrind
        uses: gungraun/setup-gungraun@v1
      - name: Run servers
        run: docker compose up -d
      - name: Cache job
        uses: Swatinem/rust-cache@v2
      - name: Run bench
        run: cargo bench --bench bench_perf --all-features

  check-examples:
    runs-on: "ubuntu-latest"
    name: Run check runtimes.
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      - name: Run servers
        run: docker compose up -d
      - name: Cache job
        uses: Swatinem/rust-cache@v2
      - name: Run examples
        run: |
          cargo run --example simple-smol --features smol-rustls-tls
          cargo run --example simple-tokio --features tokio-rustls-tls

  profiling:
    runs-on: ubuntu-latest
    name: Show profile
    steps:
      - uses: actions/checkout@v7
      - name: Install flamegraph
        uses: taiki-e/install-action@v2
        with:
          tool: flamegraph
      - name: Run server
        run: docker compose up md-unix0 -d
      - name: Cache job
        uses: Swatinem/rust-cache@v2
      - name: Generate flamegraph
        run: |
          echo '-1' | sudo tee /proc/sys/kernel/perf_event_paranoid
          cargo flamegraph --bench bench_prof --features smol-rt
      - name: Upload flamegraph artifact
        uses: actions/upload-artifact@v7
        with:
          path: "*.svg"

  hack-cross:
    name: Compiling cross
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Install cargo hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Cache job
        uses: Swatinem/rust-cache@v2
      - name: Check some flags
        run: |
          cargo hack check \
          --feature-powerset \
          --no-dev-deps \
          --mutually-exclusive-features smol-rt,tokio-rt \
          --at-least-one-of smol-rt,tokio-rt
