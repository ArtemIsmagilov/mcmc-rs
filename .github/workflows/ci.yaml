name: CI

on: [pull_request, push]

jobs:
  test:
    runs-on: "ubuntu-latest"
    name: Run tests.
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      - name: Run servers
        run: docker compose up -d
      - name: Run tests
        run: cargo test --all-features

  coverage:
    runs-on: "ubuntu-latest"
    name: Run tests coverage.
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run servers
        run: docker compose up -d
      - name: Run tests coverage
        run: cargo llvm-cov --doctests --all-features

  bench-time:
    runs-on: "ubuntu-latest"
    name: Run bench time.
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      - name: Run servers
        run: docker compose up -d
      - name: Run bench
        run: cargo bench --bench bench_time --all-features

  quality:
    name: Quality code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Analyze code
        uses: iepathos/debtmap-action@v1
      - name: View Report
        run: cat debtmap-report.md

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --all --check

  fuzz:
    name: Fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: |
          cargo fuzz run fuzz_target_1 --all-features --target x86_64-unknown-linux-gnu -- -max_total_time=15
          cargo fuzz run fuzz_target_2 --all-features --target x86_64-unknown-linux-gnu -- -max_total_time=15
          cargo fuzz run fuzz_target_3 --all-features --target x86_64-unknown-linux-gnu -- -max_total_time=15
          cargo fuzz run fuzz_target_4 --all-features --target x86_64-unknown-linux-gnu -- -max_total_time=15

  bench-perf:
    name: Run bench perf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup gungraun-runner and Valgrind
        uses: gungraun/setup-gungraun@v1
      - name: Run servers
        run: docker compose up -d
      - name: Run bench
        run: cargo bench --bench bench_perf --all-features

  check-examples:
    runs-on: "ubuntu-latest"
    name: Run check runtimes.
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      - name: Run servers
        run: docker compose up -d
      - name: Run examples
        run: |
          cargo run --example simple-smol --features smol-rustls-tls
          cargo run --example simple-tokio --features tokio-rustls-tls

  profiling:
    runs-on: ubuntu-latest
    name: Show profile
    steps:
      - uses: actions/checkout@v7
      - name: Install flamegraph
        uses: taiki-e/install-action@v2
        with:
          tool: flamegraph
      - name: Run server
        run: docker compose up md-unix0 -d
      - name: Generate flamegraph
        run: |
          echo '-1' | sudo tee /proc/sys/kernel/perf_event_paranoid
          cargo flamegraph --bench bench_prof --all-features
      - name: Upload flamegraph artifact
        uses: actions/upload-artifact@v7
        with:
          path: "*.svg"

  hack:
    runs-on: ubuntu-latest
    name: Check compiling
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Install cargo hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Check some flags
        run: cargo hack check --feature-powerset --no-dev-deps --mutually-exclusive-features smol-rt,tokio-rt --at-least-one-of smol-rt,tokio-rt
