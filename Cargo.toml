[package]
name = "mcmc-rs"
version = "0.9.0"
edition = "2024"
description = "Minimal rust client for memcached"
readme = "README.md"
repository = "https://github.com/ArtemIsmagilov/mcmc-rs"
license = "MIT"
keywords = ["memcached"]
categories = ["asynchronous", "caching", "database"]

[[example]]
name = "simple-smol"
required-features = ["smol-runtime"]

[[example]]
name = "simple-tokio"
required-features = ["tokio-runtime"]

[[bench]]
harness = false
name = "my_benchmark"

[dependencies]
async-native-tls = { version = "0.6.0", default-features = false }
crc32fast = "1.5.3"
hashring = "0.3.6"
hrw-hash = "2.0.3"
smol = { version = "2.0.2", optional = true }
tokio = { version = "1.54.1", optional = true }
thiserror = "2.0.21"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports", "async_smol"] }

[features]
default = ["smol-runtime"]
smol-runtime = ["async-native-tls/runtime-smol", "dep:smol"]
tokio-runtime = ["async-native-tls/runtime-tokio", "dep:tokio", "tokio/full"]
