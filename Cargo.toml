[package]
name = "mcmc-rs"
version = "0.10.2"
edition = "2024"
description = "Minimal rust client for memcached"
readme = "README.md"
repository = "https://github.com/ArtemIsmagilov/mcmc-rs"
license = "MIT"
keywords = ["memcached", "async", "client"]
categories = ["asynchronous", "caching", "database"]

[[example]]
name = "simple-smol"
required-features = ["smol-runtime"]

[[example]]
name = "simple-tokio"
required-features = ["tokio-runtime"]

[[bench]]
harness = false
name = "bench_time"

[[bench]]
harness = false
name = "bench_perf"

[[bench]]
name = "bench_graph"
harness = false

[dependencies]
karyon_async_rustls = { version = "1.0.1", default-features = false, optional = true }
webpki-roots = "1.0.12"
crc32fast = "1.5.5"
hashring = "0.3.7"
hrw-hash = "2.0.3"
smol = { version = "2.0.2", optional = true }
tokio = { version = "1.54.1", optional = true }
thiserror = "2.0.21"
fastrand = "2.5.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_smol"] }
gungraun = "0.20.0"
pretty_assertions = "1.4.1"

[features]
default = ["smol-runtime"]
smol-runtime = ["karyon_async_rustls/smol", "dep:smol"]
tokio-runtime = ["karyon_async_rustls/tokio", "dep:tokio", "tokio/full"]

[profile.bench]
debug = true
