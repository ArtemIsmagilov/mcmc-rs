[package]
name = "mcmc-rs"
version = "0.17.0"
edition = "2024"
description = "Minimal rust client for memcached"
readme = "README.md"
repository = "https://github.com/ArtemIsmagilov/mcmc-rs"
license = "MIT"
keywords = ["memcached", "async", "client"]
categories = ["asynchronous", "caching", "database"]

[dependencies]
thiserror = "2.0"
fastrand = "2.5"

hashring = "0.3"
hrw = "0.1"
rapidhash = "4.5"

async-net = { version = "2.0", optional = true }
futures-lite = { version = "2.6", optional = true }
tokio = { version = "1.54", optional = true, features = ["net", "io-util"] }

rustls = { version = "0.23", default-features = false, optional = true }
futures-rustls = { version = "0.26", default-features = false, optional = true }
tokio-rustls = { version = "0.26", default-features = false, optional = true }

webpki-roots = { version = "1.0", optional = true }
rustls-native-certs = { version = "0.8", optional = true }

native-tls = { version = "0.2", optional = true }

async-native-tls = { version = "0.6", optional = true }
tokio-native-tls = { version = "0.3", optional = true }

[features]
smol-rt = ["dep:async-net", "dep:futures-lite"]
tokio-rt = ["dep:tokio"]

insecure-tls = []

webpki-roots-tls = ["dep:webpki-roots"]
rustls-native-certs-tls = ["dep:rustls-native-certs"]

smol-rustls-tls = ["smol-rt", "dep:rustls", "dep:futures-rustls"]
tokio-rustls-tls = ["tokio-rt", "dep:rustls", "dep:tokio-rustls"]

smol-native-tls-tls = ["smol-rt", "dep:native-tls", "dep:async-native-tls"]
tokio-native-tls-tls = ["tokio-rt", "dep:native-tls", "dep:tokio-native-tls"]

native-tls-vendored = ["native-tls?/vendored"]

[dev-dependencies]
criterion = { version = "0.8", features = ["async_smol"] }
gungraun = "0.20"
pretty_assertions = "1.4"
tokio = { version = "1.54", features = ["full"] }
smol = "2.0"
rustls = { version = "0.23", default-features = false, features = [
  "aws-lc-rs",
] }

[profile.bench]
debug = true

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "simple-smol"
required-features = ["smol-rustls-tls"]

[[example]]
name = "simple-tokio"
required-features = ["tokio-rustls-tls"]

[[example]]
name = "sharding"
required-features = ["smol-rt"]

[[bench]]
harness = false
name = "bench_time"
required-features = ["smol-rustls-tls"]

[[bench]]
harness = false
name = "bench_perf"
required-features = ["smol-rustls-tls"]

[[bench]]
harness = false
name = "bench_prof"
required-features = ["smol-rt"]
