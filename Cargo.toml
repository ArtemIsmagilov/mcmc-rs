[package]
name = "mcmc-rs"
version = "0.10.3"
edition = "2024"
description = "Minimal rust client for memcached"
readme = "README.md"
repository = "https://github.com/ArtemIsmagilov/mcmc-rs"
license = "MIT"
keywords = ["memcached", "async", "client"]
categories = ["asynchronous", "caching", "database"]

[dependencies]
futures-rustls = { version = "0.26.0", optional = true }
tokio-rustls = { version = "0.26.6", optional = true }
webpki-roots = "1.0.12"
crc32fast = "1.5.5"
hashring = "0.3.7"
hrw-hash = "2.0.3"
async-net = { version = "2.0.0", optional = true }
futures-lite = { version = "2.6.1", optional = true }
tokio = { version = "1.54.1", optional = true, features = ["net", "io-util"] }
thiserror = "2.0.21"
fastrand = "2.5.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_smol"] }
gungraun = "0.20.0"
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["full"] }
smol = "2.0.2"

[features]
default = ["smol-runtime"]
smol-runtime = ["dep:futures-rustls", "dep:async-net", "dep:futures-lite"]
tokio-runtime = ["dep:tokio-rustls", "dep:tokio"]

[profile.bench]
debug = true

[[example]]
name = "simple-smol"
required-features = ["smol-runtime"]

[[example]]
name = "simple-tokio"
required-features = ["tokio-runtime"]

[[bench]]
harness = false
name = "bench_time"

[[bench]]
harness = false
name = "bench_perf"

[[bench]]
name = "bench_graph"
harness = false
